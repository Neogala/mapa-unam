    <style>
        /* Forzar iconos tipo pin a versión rellena */
        .icon-filled, .map-pin .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 700;
            -webkit-font-variation-settings: 'FILL' 1, 'wght' 700;
        }
        .map-pin .icon-filled { display: inline-block; line-height: 1; }

        /* Video de fondo a pantalla completa (efecto "cover") */
        .video-hero { position: relative; overflow: hidden; background: #000; }
        .video-hero__frame-wrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .video-hero__frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 0;
        }

        /* Header y footer que se ocultan tras inactividad del mouse */
        #site-header, #site-footer {
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 1;
            transform: translateY(0);
        }
        body.ui-hidden #site-header {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }
        body.ui-hidden #site-footer {
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none;
        }

        /* Botón "Entrar" con efecto glass (vidrio esmerilado) */
        .glass-button-wrap {
            position: relative;
            display: inline-block;
            isolation: isolate;
        }
        .glass-button {
            position: relative;
            display: inline-block;
            padding: 38.4px 115.2px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.12);
            -webkit-backdrop-filter: blur(16px) saturate(160%);
            backdrop-filter: blur(16px) saturate(160%);
            color: #002752;
            font-family: inherit;
            font-weight: 700;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.5),
                inset 0 -1px 8px rgba(255, 255, 255, 0.08),
                0 16px 48px rgba(0, 0, 0, 0.4);
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(1.05);
        }
        .glass-button:active {
            transform: scale(0.95);
        }
        .glass-button-shadow {
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            z-index: -1;

<script>
    // Oculta el header y el footer tras 2s de inactividad del mouse; reaparecen al moverlo.
    let uiHideTimeout;
    function showUI() {
        document.body.classList.remove('ui-hidden');
        clearTimeout(uiHideTimeout);
        uiHideTimeout = setTimeout(() => document.body.classList.add('ui-hidden'), 2000);
    }
    document.addEventListener('mousemove', showUI);
    showUI();

    // Activa el audio del video tras la primera interacción del usuario
    // (los navegadores bloquean el autoplay con sonido sin un gesto explícito).
    function unmuteVideo() {
        const video = document.getElementById('hero-video');
        if (video) {
            video.muted = false;
            video.play().catch(() => {});
        }
        document.removeEventListener('click', unmuteVideo);
        document.removeEventListener('keydown', unmuteVideo);
    }
    document.addEventListener('click', unmuteVideo);
    document.addEventListener('keydown', unmuteVideo);
</script>
